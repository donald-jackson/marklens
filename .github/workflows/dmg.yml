name: DMG

# Fires when a GitHub Release is published. Packages the macOS build .zip
# that release.yml attaches to that same release (see that workflow for why
# it's downloaded rather than rebuilt) into a standard drag-to-Applications
# .dmg, so users can also download a DMG from the release and just drag
# Marklens.app into /Applications.
#
# Can also be run manually (workflow_dispatch) to (re)build the DMG for the
# latest published release — it downloads the .zip directly from that
# release's own assets, so it doesn't depend on any other job or workflow
# run having succeeded first.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG and attach to release
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      # On a release event, use the release that triggered the workflow. On
      # a manual run, fall back to the latest published release so this can
      # be re-run standalone without needing a previous job/run to inspect.
      - name: Determine target release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            tag="$EVENT_TAG"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi

          if [ -z "$tag" ]; then
            echo "::error::Could not determine a release to package — no latest release found."
            exit 1
          fi

          echo "Using release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download macOS build from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Marklens-macOS.zip' \
            --dir dist

      - name: Unpack Marklens.app
        run: |
          mkdir -p dmg-root
          ditto -x -k dist/Marklens-macOS.zip dmg-root
          if [ ! -d "dmg-root/Marklens.app" ]; then
            echo "::error::Marklens.app not found after unzipping Marklens-macOS.zip"
            exit 1
          fi

      # Standard "drag to Applications" DMG layout: the .app plus a symlink
      # to /Applications in the same folder, imaged with hdiutil (built into
      # macOS, no extra tooling required). Building the symlink and volume
      # directly with hdiutil — rather than a Finder/AppleScript-based tool
      # like create-dmg — avoids relying on a logged-in GUI session, which
      # GitHub-hosted macOS runners don't provide.
      - name: Create Applications symlink
        run: ln -s /Applications dmg-root/Applications

      - name: Build DMG
        run: |
          hdiutil create \
            -volname "Marklens" \
            -srcfolder dmg-root \
            -fs HFS+ \
            -format UDZO \
            -ov \
            Marklens.dmg

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            Marklens.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
